<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta name="robots" content="{{robots}}">
  <meta name="theme-color" content="{{themeColor}}">

  <link rel="preload" href="/assets/fonts/instrument-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css?v={{cssVersion}}">
  <script>document.documentElement.classList.add('js')</script>
  <script src="/assets/js/site.js?v={{jsVersion}}" defer></script>

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta property="og:type" content="{{ogType}}">
  <meta property="og:site_name" content="{{siteName}}">
  <meta property="og:locale" content="{{locale}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  {{schema}}
  <!-- ANALYTICS: paste the Google Tag Manager / GA4 snippet here once the
       container ID is known. site.js already pushes events to window.dataLayer. -->
</head>
<body class="{{bodyClass}}">
  <a class="skip-link" href="#main">Skip to content</a>
  {{header}}
  <main id="main" tabindex="-1">
    {{breadcrumb}}
    {{content}}
  </main>
  {{footer}}
</body>
</html>
